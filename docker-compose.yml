services:
  db:
    image: postgres:16
    container_name: garden_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garden_bookings
      TZ: Africa/Nairobi
    ports:
      - "5432:5432"
    volumes:
      - garden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garden_bookings"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  garden_pgdata:
