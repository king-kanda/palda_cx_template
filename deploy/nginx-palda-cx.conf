# /etc/nginx/sites-available/palda-cx. bootstrap.sh writes this for you with your domain and port filled in.
# Without a Cloudflare origin certificate, start from this http-only version and run:  sudo certbot --nginx -d <domain>
server {
    listen 80;
    listen [::]:80;
    server_name jawabu.palda.co.ke;

    client_max_body_size 25m;   # business documents and knowledge uploads

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An agent reply ("Test as customer", Meta webhooks) can take a while with a real model.
        proxy_read_timeout 120s;
    }
}
